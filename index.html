<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumpleaños de Angelina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdd2dc;--ink:#e0699a;--soft:#e9a3bd;--paper:#f3f0ea;--env:#ffffff;--env2:#f1ebe4;--yellow:#f6c453;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fdd2dc}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}

/* SOBRE */
.envwrap{position:absolute;display:flex;flex-direction:column;align-items:center;gap:28px;transition:transform .9s ease,opacity .7s ease}
.env{position:relative;width:min(84vw,340px);aspect-ratio:3/2;background:var(--env);border-radius:6px;box-shadow:0 14px 30px rgba(190,80,120,.3);cursor:pointer;border:0;padding:0;font:inherit}
.env:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
.peek{position:absolute;left:6%;right:6%;top:6%;bottom:6%;background:var(--paper);border-radius:4px;transition:transform .9s cubic-bezier(.3,.8,.3,1);display:flex;align-items:center;justify-content:center;font-family:'Alex Brush',cursive;font-size:34px;color:var(--ink)}
.front{position:absolute;inset:0;background:linear-gradient(135deg,var(--env2) 0 50%,transparent 50%),linear-gradient(225deg,var(--env2) 0 50%,transparent 50%);border-radius:6px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.front::after{content:"";position:absolute;inset:0;background:var(--env);clip-path:polygon(0 100%,0 0,50% 58%,100% 0,100% 100%);opacity:.0}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease .05s,z-index 0s .35s;z-index:3;border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:58%;width:78px;height:78px;margin:-39px 0 0 -39px;z-index:4;filter:drop-shadow(0 4px 6px rgba(150,40,90,.35));transition:opacity .3s,transform .6s}.seal svg{width:100%;height:100%;display:block}.corner{position:absolute;width:54px;height:54px;z-index:2;filter:drop-shadow(0 2px 3px rgba(150,40,90,.25))}.c1{left:-10px;bottom:-10px;transform:rotate(-15deg)}.c2{right:-12px;bottom:-8px;transform:rotate(20deg)}
.hint{font-size:22px;font-weight:600;letter-spacing:.02em;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.opened .flap{transform:rotateX(180deg);z-index:1}
.opened .seal{opacity:0;transform:scale(1.4) rotate(40deg)}
.opened .peek{transform:translateY(-38%)}
.hint.off{visibility:hidden}
.gone{transform:translateY(60vh);opacity:0;pointer-events:none}

/* INVITACIÓN */
.invite{position:absolute;inset:0;opacity:0;transform:scale(.94);pointer-events:none;transition:opacity .9s ease,transform .9s ease;overflow-y:auto;-webkit-overflow-scrolling:touch}
.invite.show{opacity:1;transform:none;pointer-events:auto}
.sheet{width:min(100%,440px);margin:0 auto;padding-bottom:40px}
.sheet img{display:block;width:100%;height:auto}
.rsvp{margin:0 18px;padding:22px 20px;background:var(--paper);border-radius:22px;box-shadow:0 8px 24px rgba(190,80,120,.2);text-align:center}
.rsvp h2{margin:0 0 4px;font-family:'Playfair Display',serif;font-size:26px}
.rsvp p{margin:0 0 14px;font-size:19px;font-weight:600;color:var(--soft)}
.rsvp input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--soft);border-radius:12px;background:#fff;font:600 19px 'Cormorant Garamond',serif;color:#7a2d4d;margin-bottom:12px}
.rsvp input[type=text]:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:2px solid var(--soft);border-radius:12px;margin-bottom:10px;font-size:20px;font-weight:600;cursor:pointer;background:#fff}
.opt input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.opt:has(input:checked){border-color:var(--ink);background:#fff0f5}
.btn{width:100%;margin-top:6px;padding:13px 20px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:700 20px 'Cormorant Garamond',serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn:focus-visible{outline:3px solid #7a2d4d;outline-offset:3px}
.btn:disabled{opacity:.5}
.msg{font-size:20px;font-weight:600;margin-top:10px;color:#7a2d4d}
.owner{margin:18px;padding:18px;background:#fff;border-radius:18px;font-size:19px;color:#7a2d4d}
.owner h3{margin:0 0 8px;font-family:'Playfair Display',serif;font-size:21px}
.owner ul{margin:0 0 12px;padding-left:20px}
[hidden]{display:none!important}
.map{display:block;width:auto;margin:16px 18px 0;text-align:center;box-shadow:0 6px 16px rgba(190,80,120,.25)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.count{margin:18px 18px 16px;padding:18px 12px;background:var(--paper);border-radius:22px;box-shadow:0 8px 24px rgba(190,80,120,.2);text-align:center}
.count h2{margin:0 0 12px;font-family:'Playfair Display',serif;font-size:22px}
.cd{display:flex;justify-content:center;gap:8px}
.cd div{flex:1;max-width:80px;background:#fff;border:2px solid var(--soft);border-radius:14px;padding:8px 2px}
.cd b{display:block;font-family:'Playfair Display',serif;font-size:30px;line-height:1.1;color:var(--ink)}
.cd span{font-size:15px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.cdmsg{font-family:'Alex Brush',cursive;font-size:34px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="flower">
      <g fill="currentColor">
        <ellipse cx="50" cy="22" rx="17" ry="22"/><ellipse cx="50" cy="22" rx="17" ry="22" transform="rotate(72 50 50)"/>
        <ellipse cx="50" cy="22" rx="17" ry="22" transform="rotate(144 50 50)"/><ellipse cx="50" cy="22" rx="17" ry="22" transform="rotate(216 50 50)"/>
        <ellipse cx="50" cy="22" rx="17" ry="22" transform="rotate(288 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="10" fill="#f6c453"/>
    </g>
  </defs>
</svg>

<canvas id="confetti" aria-hidden="true"></canvas>
<main class="stage">
  <div class="envwrap" id="envwrap">

      <svg class="corner c1" viewBox="0 0 100 100" style="color:#f8d36a" aria-hidden="true"><use href="#flower"/></svg>
      <svg class="corner c2" viewBox="0 0 100 100" style="color:#f5b6cb" aria-hidden="true"><use href="#flower"/></svg>
    </button>
    <div class="hint">Tocá el sobre para abrirlo</div>
  </div>

<script>
(function(){
  /* CAMBIAR: número de Angelina con código de país, sin + ni espacios. Ej: 5492914123456 */
  var HOST_WA="5492984201336";
  var env=document.getElementById('env'),wrap=document.getElementById('envwrap'),inv=document.getElementById('invite');
  var done=false;
  function open_(){
    if(done)return; done=true;
    env.classList.add('opened');document.querySelector('.hint').classList.add('off');
    setTimeout(function(){wrap.classList.add('gone');inv.classList.add('show');confetti();},1100);
  }
  env.addEventListener('click',open_);
  var form=document.getElementById('form');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var name=document.getElementById('name').value.trim(); if(!name)return;
    var t='Hola Angelina! Soy '+name+' y '+(form.r.value==='si'?'confirmo que voy ✅':'no puedo ir 😢')+' a tu cumple 🎂';
    window.location.href='https://wa.me/'+HOST_WA+'?text='+encodeURIComponent(t);
  });
  /* Confeti */
  function confetti(){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var c=document.getElementById('confetti'),x=c.getContext('2d'),W,H,dpr=window.devicePixelRatio||1;
    function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
    size();
    var cols=['#ee8fb0','#f5b6cb','#f6c453','#f8d36a','#ffffff','#e0699a'],P=[],i;
    for(i=0;i<160;i++){var side=i%2?1:-1;P.push({x:W/2+side*W*.1,y:H*.55,vx:(Math.random()*9+2)*side*(Math.random()<.5?1:-1)*.8+(Math.random()-.5)*6,vy:-(Math.random()*13+6),w:Math.random()*8+5,h:Math.random()*5+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,col:cols[i%cols.length],round:i%4===0})}
    var t0=performance.now();
    (function frame(t){
      var el=t-t0;x.clearRect(0,0,W,H);
      P.forEach(function(p){p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
        x.save();x.globalAlpha=Math.max(0,Math.min(1,(4200-el)/900));x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;
        if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,7);x.fill()}else{x.fillRect(-p.w/2,-p.h/2,p.w,p.h)}x.restore()});
      if(el<4200)requestAnimationFrame(frame);else x.clearRect(0,0,W,H);
    })(t0);
  }
  /* Cuenta regresiva: domingo 15/11/2026 17:00 (Argentina, UTC-3) */
  var target=new Date('2026-11-15T17:00:00-03:00').getTime();
  function tick(){
    var ms=target-Date.now(),box=document.getElementById('count');

    document.getElementById('m').textContent=Math.floor(s%3600/60);
    document.getElementById('sg').textContent=s%60;
  }
  tick();setInterval(tick,1000);
})();
